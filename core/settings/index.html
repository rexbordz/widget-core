<!DOCTYPE html>
<html lang="en" class="wa-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Widget Settings</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Required: default theme + autoloader -->
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.11.0/styles/themes/default.css">
  <script type="module" src="https://ka-f.webawesome.com/webawesome@3.11.0/webawesome.loader.js"></script>

  <!-- Recommended: utility classes ("CSS Utilities") -->
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.11.0/styles/utilities.css">

  <!-- Optional: CSS reset ("Native Styles") -->
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.11.0/styles/native.css">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="loading-overlay">
    <img src="../../assets/images/circle-logo.png" alt="" class="loading-logo">
    <div class="loading-spinner"></div>
  </div>

  <div class="settings-container">
    <div class="settings-panel">
      <div class="settings-header">
        <img id="widgetLogo" src="../../assets/images/rexbordz-blue-and-white-gradient-logo.png" alt="Widget Logo" class="widget-logo">
        <h1 id="widgetTitle" class="widget-title">Widget Settings</h1>
      </div>

      <div class="settings-body">
        <div id="settingsForm"></div>
        <div id="actionArea"></div>

        <button id="applySettings" type="button" class="primary-button">Copy Link URL</button>

        <div class="utility-button-row">
          <button id="loadDefaultsButton" type="button" class="utility-button">Load Default</button>
          <button id="openLoadSettingsModalButton" type="button" class="utility-button utility-button-gray">Load Settings</button>
        </div>

        <div id="settingsFooter" class="settings-footer"></div>
      </div>
    </div>

    <div id="panelResizer" class="panel-resizer"></div>

    <div class="preview-panel">
      <iframe id="previewFrame" frameborder="0"></iframe>
    </div>
  </div>

  <wa-dialog id="loadSettingsModal" label="Load Settings" light-dismiss>
    <p class="modal-note">Paste your widget URL with parameters to populate the form fields.</p>

    <wa-textarea
      id="loadSettingsUrlInput"
      class="modal-url-input"
      placeholder="Paste widget URL here"
      rows="4"
      resize="vertical"
      spellcheck="false"
    ></wa-textarea>

    <p id="loadSettingsError" class="modal-error hidden">Please enter a valid widget URL.</p>

    <button id="confirmLoadSettingsButton" slot="footer" type="button" class="primary-button">Load</button>
  </wa-dialog>

  <script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
  <script src="./script.js"></script>
</body>
</html>
